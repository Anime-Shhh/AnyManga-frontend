name: Frontend checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack
      - name: Reader and image regressions
        env:
          CI: 'true'
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          ANYMANGA_TEST_URL: http://127.0.0.1:3002
          MANGA_API_ORIGIN: http://127.0.0.1:18080
        run: |
          npm run start -- -p 3002 > /tmp/anymanga-frontend.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3002/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:reader
          npm run test:images
          npm run test:controls
          npm run test:download
          npm run test:manga
